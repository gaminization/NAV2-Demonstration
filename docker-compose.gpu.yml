# NVIDIA GPU override. Needs the NVIDIA Container Toolkit on the host.
# Used automatically by:  GPU=1 scripts/docker.sh up
services:
  sim:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    command: >
      ros2 launch nav2-demo nav2-demo.launch.py
      world:=${WORLD:-tb3_world} model:=${TURTLEBOT3_MODEL:-waffle} gpu:=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
