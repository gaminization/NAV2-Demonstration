# Nav2 tuning profiles. Select with:  nav_profile:=<name>
#   default  stock TurtleBot3 params, untouched (DWB controller + NavFn planner)
#   tuned    same algorithms, better inflation for tight spaces
#   rpp      Regulated Pure Pursuit controller + Smac 2D planner
#   mppi     MPPI controller + Smac 2D planner (needs ros-humble-nav2-mppi-controller; experimental)
#
# Precedence: profile < models < world "nav_overrides" (worlds.yaml). 'default' ignores both.
# Allowed settings: controller, planner, inflation_radius, cost_scaling_factor, robot_radius.
# NOTE: the numbers below are starting points that have NOT been tuned in simulation.

profiles:
  default: {}
  tuned:
    inflation_radius: 0.40
    cost_scaling_factor: 4.0
  rpp:
    controller: rpp
    planner: smac2d
    inflation_radius: 0.40
    cost_scaling_factor: 4.0
  mppi:
    controller: mppi
    planner: smac2d
    inflation_radius: 0.40
    cost_scaling_factor: 4.0

models:
  burger:
    robot_radius: 0.12

controllers:
  rpp:
    plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
    desired_linear_vel: 0.22
    lookahead_dist: 0.6
    min_lookahead_dist: 0.3
    max_lookahead_dist: 0.9
    lookahead_time: 1.5
    rotate_to_heading_angular_vel: 1.0
    transform_tolerance: 0.1
    use_velocity_scaled_lookahead_dist: false
    min_approach_linear_velocity: 0.05
    approach_velocity_scaling_dist: 0.6
    use_collision_detection: true
    max_allowed_time_to_collision_up_to_carrot: 1.0
    use_regulated_linear_velocity_scaling: true
    use_cost_regulated_linear_velocity_scaling: false
    regulated_linear_scaling_min_radius: 0.9
    regulated_linear_scaling_min_speed: 0.15
    use_rotate_to_heading: true
    rotate_to_heading_min_angle: 0.785
    max_angular_accel: 3.2
  mppi:
    plugin: "nav2_mppi_controller::MPPIController"
    time_steps: 56
    model_dt: 0.05
    batch_size: 2000
    vx_std: 0.2
    vy_std: 0.2
    wz_std: 0.4
    vx_max: 0.22
    vx_min: -0.1
    vy_max: 0.0
    wz_max: 1.5
    iteration_count: 1
    prune_distance: 1.7
    transform_tolerance: 0.1
    temperature: 0.3
    gamma: 0.015
    motion_model: "DiffDrive"
    visualize: false
    critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
              "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
    ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
    GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 1.0}
    GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.5}
    PreferForwardCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.5}
    CostCritic: {enabled: true, cost_power: 1, cost_weight: 3.81, critical_cost: 300.0, consider_footprint: true, collision_cost: 1000000.0, near_goal_distance: 1.0}
    PathAlignCritic: {enabled: true, cost_power: 1, cost_weight: 14.0, max_path_occupancy_ratio: 0.05, trajectory_point_step: 4, threshold_to_consider: 0.5, offset_from_furthest: 20}
    PathFollowCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, offset_from_furthest: 5, threshold_to_consider: 1.0}
    PathAngleCritic: {enabled: true, cost_power: 1, cost_weight: 2.0, offset_from_furthest: 4, threshold_to_consider: 0.5, max_angle_to_furthest: 1.0}

planners:
  smac2d:
    plugin: "nav2_smac_planner/SmacPlanner2D"
    tolerance: 0.25
    downsample_costmap: false
    downsampling_factor: 1
    allow_unknown: true
    max_iterations: 1000000
    max_on_approach_iterations: 1000
    max_planning_time: 2.0
    cost_travel_multiplier: 2.0
    use_final_approach_orientation: false
    smoother:
      max_iterations: 1000
      w_smooth: 0.3
      w_data: 0.2
      tolerance: 1.0e-10
